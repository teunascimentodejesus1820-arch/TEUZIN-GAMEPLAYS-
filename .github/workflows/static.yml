<script>
function mostrarPagina(nome, secao) {
  document.querySelectorAll('.pagina').forEach(function(pagina) {
    pagina.classList.remove('ativa');
  });

  document.getElementById(nome).classList.add('ativa');
  window.scrollTo(0, 0);

  if (secao) {
    setTimeout(function() {
      var alvo = secao === 'pes17'
        ? document.getElementById('secao-pes17')
        : document.getElementById('secao-pes21');

      alvo.scrollIntoView({ behavior: 'smooth' });
    }, 50);
  }
}
</script>

