<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEUZIN GAMEPLAYS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d18;color:white;line-height:1.6}
header{background:#111a2b;padding:20px;text-align:center;border-bottom:2px solid #168cff}
.logo{width:85px;height:85px;object-fit:cover;border-radius:14px;margin-bottom:8px}
h1{color:#39d0ff}
header p{color:#b8c4d9;margin:8px 0 15px}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button,.btn{border:0;display:inline-block;background:#1769ff;color:white;padding:11px 15px;border-radius:8px;font-weight:bold;text-decoration:none;cursor:pointer}
button:hover,.btn:hover{background:#39baff;color:#08111f}
main{width:92%;max-width:1100px;margin:auto}
.hero{text-align:center;padding:40px 10px}
.hero h2{font-size:30px;margin-bottom:12px}
.hero p{color:#b8c4d9;margin-bottom:20px}
section{padding:25px 0}
.titulo{font-size:26px;color:#39d0ff;border-left:4px solid #1769ff;padding-left:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:#111a2b;border:1px solid #293650;border-radius:14px;overflow:hidden}
.card img{width:100%;height:165px;object-fit:cover;display:block;background:#202c42}
.conteudo{padding:17px}
.badge{display:inline-block;background:#243e65;color:#8ee7ff;padding:4px 9px;border-radius:20px;font-size:12px;margin-bottom:8px}
.card h3{margin-bottom:8px}
.card p{color:#b8c4d9;font-size:14px;margin-bottom:15px}
.card .btn{width:100%;text-align:center}
.aviso{color:#b8c4d9;border:1px dashed #43516c;padding:15px;border-radius:10px;margin:18px 0}
footer{text-align:center;padding:25px;background:#111a2b;color:#b8c4d9;margin-top:30px;font-size:13px}
.pagina{display:none}
.pagina.ativa{display:block}
@media(max-width:750px){.grid{grid-template-columns:1fr}.hero h2{font-size:25px}}
</style>
</head>

